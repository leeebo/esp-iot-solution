targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32p4
  - esp32h4
  - linux
dependencies:
  idf: ">=5.4.0"
  cmake_utilities: "0.*"
  touch_button_sensor:
    version: "*"
    override_path: "../../../../components/touch/touch_button_sensor"
  espressif/esp32_p4_function_ev_board:
    version: "*"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: ">=0.4.3"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: ">=0.0.34"
    rules:
      - if: "target == esp32p4"
  protocol_examples_common:
    path: "${IDF_PATH}/examples/common_components/protocol_examples_common"
  mcp-c-sdk:
    version: "*"
    override_path: "../../../../components/mcp-c-sdk"
  espressif/mdns:
    version: "*"
